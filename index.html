
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#050b13;color:#00eaff;
  font-family:Arial,sans-serif;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
}
.app{text-align:center;width:100%;padding:24px}
h1{letter-spacing:8px;font-size:34px}
.circle{
  width:190px;height:190px;border:3px solid #00eaff;
  border-radius:50%;margin:35px auto;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 25px #00eaff,inset 0 0 25px #00eaff;
  animation:pulse 2s infinite;
}
.core{width:85px;height:85px;border-radius:50%;
background:radial-gradient(circle,#fff,#00eaff 45%,#06334c)}
button{
  background:#00eaff;color:#001018;border:0;border-radius:24px;
  padding:14px 24px;font-size:17px;font-weight:bold;margin:8px;
}
#status{color:#fff;min-height:26px}
input{width:95%;padding:13px;border-radius:10px;
border:1px solid #00eaff;background:#101d2a;color:white}
@keyframes pulse{50%{box-shadow:0 0 40px #00eaff,inset 0 0 35px #00eaff}}
</style>
</head>
<body>
<div class="app">
<h1>J.A.R.V.I.S</h1>
<p>PERSONAL AI ASSISTANT</p>
<div class="circle"><div class="core"></div></div>
<p id="status">System Online</p>
<button onclick="listen()">🎙 Speak</button>
<p><input id="cmd" placeholder="Type a command..."></p>
<button onclick="runCommand()">Run Command</button>
</div>
<script>
function speak(t){
 if(!('speechSynthesis' in window)){return}
 speechSynthesis.cancel();
 speechSynthesis.speak(new SpeechSynthesisUtterance(t));
}
function runCommand(){
 const c=document.getElementById('cmd').value.toLowerCase();
 let r='Sorry, I do not know that command yet.';
 if(c.includes('hello')||c.includes('नमस्कार'))r='Hello! I am Jarvis. नमस्कार!';
 else if(c.includes('time')||c.includes('वेळ'))r='The time is '+new Date().toLocaleTimeString();
 else if(c.includes('date')||c.includes('तारीख'))r='Today is '+new Date().toLocaleDateString();
 else if(c.includes('youtube')){r='Opening YouTube';window.open('https://youtube.com','_blank')}
 else if(c.includes('google')){r='Opening Google';window.open('https://google.com','_blank')}
 document.getElementById('status').textContent=r;speak(r);
}
function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){document.getElementById('status').textContent='Voice recognition not supported. Try Chrome.';return}
 const rec=new SR();rec.lang='en-IN';rec.onresult=e=>{
 document.getElementById('cmd').value=e.results[0][0].transcript;runCommand()
 };
 rec.onerror=()=>document.getElementById('status').textContent='Please allow microphone access';
 rec.start();document.getElementById('status').textContent='Listening...';
}
</script>
</body>
</html>
