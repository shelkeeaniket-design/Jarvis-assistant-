
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050b13;color:#00eaff;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;align-items:center;justify-content:center;
}
.app{text-align:center;width:100%;padding:24px 18px}
h1{font-size:38px;letter-spacing:6px}
p{font-size:20px}
.circle{
 width:190px;height:190px;border:3px solid #00eaff;
 border-radius:50%;margin:35px auto;
 display:flex;align-items:center;justify-content:center;
 box-shadow:0 0 30px #00eaff;
 animation:pulse 2s infinite;
}
.core{
 width:85px;height:85px;border-radius:50%;
 background:radial-gradient(circle,#fff,#00eaff 45%,#06334c);
}
@keyframes pulse{50%{box-shadow:0 0 45px #00eaff}}
button{
 background:#00eaff;color:#001018;border:0;
 border-radius:25px;padding:16px 24px;
 font-size:18px;font-weight:bold;margin:10px;
}
input{
 width:100%;padding:16px;border:1px solid #00eaff;
 background:#101d2a;color:white;border-radius:12px;
 font-size:18px;margin-top:18px;
}
#status{color:white;min-height:50px;line-height:1.5}
</style>
</head>

<body>
<div class="app">
<h1>J.A.R.V.I.S</h1>
<p>PERSONAL AI ASSISTANT</p>

<div class="circle"><div class="core"></div></div>

<div id="status">System Online. Hello Boss!</div>

<button onclick="listen()">🎙️ Speak</button>

<input id="cmd" placeholder="Type a command...">

<button onclick="runCommand()">Run Command</button>
</div>

<script>
let voices = [];

function loadVoices(){
  if ("speechSynthesis" in window) {
    voices = window.speechSynthesis.getVoices();
  }
}

if ("speechSynthesis" in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text){
  if (!("speechSynthesis" in window)) {
    document.getElementById("status").textContent =
      "Speech is not supported in this browser.";
    return;
  }

  const synth = window.speechSynthesis;
  synth.cancel();

  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-IN";
  msg.rate = 0.9;
  msg.pitch = 0.85;
  msg.volume = 1;

  loadVoices();

  const voice =
    voices.find(v => v.lang.toLowerCase() === "mr-in") ||
    voices.find(v => v.lang.toLowerCase() === "en-in") ||
    voices.find(v => v.lang.toLowerCase() === "en-us");

  if (voice) msg.voice = voice;

  msg.onerror = function(){
    document.getElementById("status").textContent =
      "Voice error. Please check phone speech settings.";
  };

  synth.speak(msg);
}

function runCommand(){
  const c = document.getElementById("cmd").value
    .trim().toLowerCase();

  let r = "";

  if (!c) {
    r = "Please tell me a command, Boss.";
  } else if (c.includes("hello") || c.includes("नमस्कार")) {
    r = "Hello Boss! I am Jarvis. नमस्कार!";
  } else if (c.includes("time") || c.includes("वेळ")) {
    r = "The time is " +
      new Date().toLocaleTimeString("en-IN");
  } else if (c.includes("date") || c.includes("तारीख")) {
    r = "Today's date is " +
      new Date().toLocaleDateString("en-IN");
  } else if (c.includes("youtube")) {
    r = "Opening YouTube, Boss.";
    document.getElementById("status").textContent = r;
    speak(r);
    window.open("https://m.youtube.com/", "_blank");
    return;
  } else if (c.includes("google")) {
    r = "Opening Google, Boss.";
    document.getElementById("status").textContent = r;
    speak(r);
    window.open("https://www.google.com/", "_blank");
    return;
  } else {
    r = "Sorry Boss, I do not know that command yet.";
  }

  document.getElementById("status").textContent = r;
  speak(r);
}

function listen(){
  const SR = window.SpeechRecognition ||
             window.webkitSpeechRecognition;

  if (!SR) {
    document.getElementById("status").textContent =
      "Voice recognition is unavailable. Please type a command.";
    speak("Please type your command, Boss.");
    return;
  }

  const rec = new SR();
  rec.lang = "en-IN";
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  document.getElementById("status").textContent =
    "Listening, Boss...";

  rec.onresult = function(event){
    document.getElementById("cmd").value =
      event.results[0][0].transcript;
    runCommand();
  };

  rec.onerror = function(){
    document.getElementById("status").textContent =
      "Could not hear you. Please try again.";
  };

  rec.start();
}
</script>
</body>
</html>
